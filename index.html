<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e">
<meta name="description" content="LINGUA - 翻訳と英語学習をひとつに。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>LINGUA</title>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">L</span><span>LINGUA</span><small>TRANSLATE & LEARN</small></div>
  <button id="historyBtn" class="icon-btn" aria-label="履歴">◷</button>
</header>
<main>
  <section class="hero">
    <div class="eyebrow">YOUR LANGUAGE COMPANION</div>
    <h1>言葉を、<em>理解</em>する。</h1>
    <p>翻訳するだけでなく、文法や使い方まで。</p>
  </section>

  <section class="translator panel">
    <div class="language-row">
      <button id="sourceLang" class="lang active">日本語</button>
      <button id="swapBtn" class="swap" aria-label="言語を入れ替え">⇄</button>
      <button id="targetLang" class="lang">ENGLISH</button>
    </div>
    <textarea id="sourceText" placeholder="翻訳したい文章を入力..." rows="5"></textarea>
    <div class="input-tools">
      <span id="charCount">0 / 2000</span>
      <div>
        <button id="micBtn" class="tool-btn">🎙 音声入力</button>
        <button id="clearBtn" class="tool-btn">消去</button>
      </div>
    </div>
    <div class="actions">
      <button id="translateBtn" class="primary">翻訳する <span>→</span></button>
      <label class="secondary upload-label">▧ 写真から翻訳<input id="photoInput" type="file" accept="image/*" capture="environment" hidden></label>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
  </section>

  <section id="resultSection" class="result-section hidden">
    <div class="section-head"><span class="eyebrow">TRANSLATION</span><button id="speakBtn" class="tool-btn">▶ 読み上げ</button></div>
    <div class="panel result-panel">
      <div class="result-label">翻訳結果</div>
      <div id="translatedText" class="translated"></div>
      <div class="result-actions"><button id="copyBtn" class="text-btn">コピー</button><button id="saveBtn" class="text-btn">☆ 単語帳に保存</button></div>
    </div>
    <div class="panel explanation">
      <div class="section-head"><h2>ことばの解説</h2><span class="tag">BASIC</span></div>
      <div id="basicExplanation"></div>
      <details class="more-details">
        <summary>＋ より詳しく</summary>
        <div id="deepExplanation"></div>
      </details>
    </div>
  </section>

  <section id="photoPreview" class="panel hidden">
    <div class="section-head"><h2>写真の英文を読み取り</h2><span class="tag">OCR</span></div>
    <img id="previewImage" alt="選択した写真">
    <p id="ocrStatus" class="status">画像を読み込んでいます...</p>
    <textarea id="ocrText" rows="4" placeholder="読み取った英文がここに表示されます"></textarea>
    <button id="useOcrBtn" class="primary">この文章を翻訳する →</button>
  </section>

  <section id="historySection" class="panel hidden">
    <div class="section-head"><h2>最近の履歴</h2><button id="closeHistory" class="text-btn">閉じる</button></div>
    <div id="historyList"></div>
  </section>

  <footer>LINGUA <span>·</span> Learn beyond translation</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
